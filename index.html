<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; }
        input { padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔐 Accesso</h1>
    <input type="password" id="pwd" placeholder="Inserisci password">
    <button onclick="check()">Accedi</button>
    <p id="err" style="color:red; display:none;">Password sbagliata!</p>
    
    <script>
        const pass = 'watchegypt2026';
        function check() {
            if (document.getElementById('pwd').value === pass) {
                window.location = 'egitto-gestionale-pwa.html';
            } else {
                document.getElementById('err').style.display = 'block';
            }
        }
    </script>
</body>
</html>
