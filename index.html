<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body { text-align: center; padding: 100px; font-family: Arial; }
        input { padding: 10px; font-size: 16px; width: 200px; }
        button { padding: 10px 30px; font-size: 16px; cursor: pointer; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>🔐 Accesso Riservato</h1>
    <p>
        <input type="password" id="pass" placeholder="Password">
        <button onclick="accedi()">Accedi</button>
    </p>
    <p class="error" id="err" style="display:none;">Password errata!</p>

    <script>
        function accedi() {
            if (document.getElementById('pass').value === 'watchegypt2026') {
                document.body.innerHTML = '<iframe src="egitto-gestionale-pwa.html" style="width:100vw; height:100vh; border:none;"></iframe>';
            } else {
                document.getElementById('err').style.display = 'block';
                document.getElementById('pass').value = '';
            }
        }
        document.getElementById('pass').onkeypress = function(e) {
            if (e.key === 'Enter') accedi();
        }
    </script>
</body>
</html>
