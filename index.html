<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body { text-align: center; padding: 100px; font-family: Arial; background: #f0f0f0; }
        input { padding: 10px; font-size: 16px; width: 200px; margin: 10px; }
        button { padding: 10px 30px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>🔐 Accesso</h1>
    <input type="password" id="pass" placeholder="Password">
    <button onclick="accedi()">Accedi</button>
    <p class="error" id="err" style="display:none;">Password errata!</p>

    <script>
        function accedi() {
            if (document.getElementById('pass').value === 'watchcrypt2026') {
                window.location = 'egitto-gestionale-pwa.html';
            } else {
                document.getElementById('err').style.display = 'block';
                document.getElementById('pass').value = '';
            }
        }
    </script>
</body>
</html>
