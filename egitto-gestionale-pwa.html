<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Egitto Gestionale">
    <meta name="application-name" content="Egitto Gestionale">
    <meta name="description" content="Gestionale escursioni sincronizzato in tempo reale">
    <meta name="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%232563eb' width='192' height='192'/><text x='96' y='120' font-size='80' fill='white' text-anchor='middle' font-weight='bold'>E</text></svg>">
    
    <link rel="manifest" href="data:application/json,{%22name%22:%22Gestionale Escursioni Egitto%22,%22short_name%22:%22Egitto%22,%22description%22:%22Gestionale sincronizzato in tempo reale%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22%23ffffff%22,%22theme_color%22:%22%232563eb%22,%22orientation%22:%22portrait-primary%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%232563eb' width='192' height='192'/><text x='96' y='120' font-size='80' fill='white' text-anchor='middle' font-weight='bold'>E</text></svg>%22,%22sizes%22:%22192x192%22,%22type%22:%22image/svg+xml%22,%22purpose%22:%22any%22},{%22src%22:%22data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect fill='%232563eb' width='512' height='512'/><text x='256' y='380' font-size='200' fill='white' text-anchor='middle' font-weight='bold'>E</text></svg>%22,%22sizes%22:%22512x512%22,%22type%22:%22image/svg+xml%22,%22purpose%22:%22any%22}]}">
    
    <title>Gestionale Escursioni Egitto</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            height: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(to bottom right, #fef3c7, white, #cffafe);
            min-height: 100vh;
            height: 100%;
            position: fixed;
            width: 100%;
            overflow: hidden;
        }
        #root {
            height: 100vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .install-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to right, #2563eb, #1d4ed8);
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            z-index: 999;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .install-banner button {
            background: white;
            color: #2563eb;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }
        .install-banner .close-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 4px 8px;
            font-weight: 700;
        }
        .app-container {
            padding-top: 50px;
        }
        .setup-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }
        .setup-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 100%;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        @media (min-width: 600px) {
            .setup-content {
                max-width: 500px;
            }
        }
        .sync-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 16px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
        }
        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        .sync-dot.connected {
            background: #16a34a;
        }
        .sync-dot.disconnected {
            background: #dc2626;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:application/javascript,' + encodeURIComponent(`
                self.addEventListener('install', event => {
                    console.log('SW installed');
                    self.skipWaiting();
                });
                
                self.addEventListener('activate', event => {
                    console.log('SW activated');
                    event.waitUntil(clients.claim());
                });
                
                self.addEventListener('fetch', event => {
                    if (event.request.method !== 'GET') return;
                    event.respondWith(
                        caches.match(event.request)
                            .then(response => response || fetch(event.request))
                            .catch(() => new Response('Offline'))
                    );
                });
            `)).catch(err => console.log('SW registration failed:', err));
        }

        // Installa app su home screen
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });
    </script>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        // SVG Icons
        const PlusIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const TrashIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
        const DownloadIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;

        // Install Banner Component
        const InstallBanner = ({ onInstall, onClose, showBanner }) => {
            if (!showBanner) return null;

            return (
                <div className="install-banner">
                    <div style={{flex: 1}}>
                        <strong>📱 Installa app sulla home screen</strong>
                    </div>
                    <button onClick={onInstall}>
                        <DownloadIcon style={{marginRight: '4px'}}/> Installa
                    </button>
                    <button className="close-btn" onClick={onClose}>✕</button>
                </div>
            );
        };

        // Component Setup Firebase
        const FirebaseSetup = ({ onComplete }) => {
            const [config, setConfig] = useState({
                apiKey: '',
                projectId: '',
                databaseURL: '',
                authDomain: ''
            });
            const [error, setError] = useState('');

            const handleChange = (field, value) => {
                setConfig(prev => ({ ...prev, [field]: value }));
            };

            const handleSubmit = () => {
                if (!config.apiKey || !config.projectId || !config.databaseURL) {
                    setError('Compila tutti i campi obbligatori');
                    return;
                }
                try {
                    window.firebaseConfig = config;
                    localStorage.setItem('firebaseConfig', JSON.stringify(config));
                    onComplete(config);
                } catch (e) {
                    setError('Errore nella configurazione: ' + e.message);
                }
            };

            return (
                <div className="setup-modal">
                    <div className="setup-content">
                        <h2 style={{fontSize: '24px', fontWeight: 'bold', marginBottom: '8px', color: '#111827'}}>⚙️ Setup Firebase</h2>
                        <p style={{color: '#6b7280', marginBottom: '24px', fontSize: '14px', lineHeight: '1.6'}}>
                            Incolla i dati dalla tua console Firebase per sincronizzare l'app tra i phone.<br/><br/>
                            <strong>Come trovare i dati:</strong><br/>
                            1️⃣ Vai su <code style={{backgroundColor: '#f3f4f6', padding: '2px 6px', borderRadius: '3px'}}>console.firebase.google.com</code><br/>
                            2️⃣ Crea un progetto gratuito<br/>
                            3️⃣ Realtime Database → Copia i 4 dati
                        </p>
                        
                        <div style={{display: 'flex', flexDirection: 'column', gap: '12px', marginBottom: '16px'}}>
                            <div>
                                <label style={{fontSize: '12px', fontWeight: '600', color: '#374151'}}>API Key *</label>
                                <input 
                                    type="text" 
                                    placeholder="AIzaSy..." 
                                    value={config.apiKey}
                                    onChange={(e) => handleChange('apiKey', e.target.value)}
                                    style={{width: '100%', padding: '10px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '13px', fontFamily: 'monospace', marginTop: '4px', boxSizing: 'border-box'}}
                                />
                            </div>
                            <div>
                                <label style={{fontSize: '12px', fontWeight: '600', color: '#374151'}}>Project ID *</label>
                                <input 
                                    type="text" 
                                    placeholder="my-project-id" 
                                    value={config.projectId}
                                    onChange={(e) => handleChange('projectId', e.target.value)}
                                    style={{width: '100%', padding: '10px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '13px', fontFamily: 'monospace', marginTop: '4px', boxSizing: 'border-box'}}
                                />
                            </div>
                            <div>
                                <label style={{fontSize: '12px', fontWeight: '600', color: '#374151'}}>Database URL *</label>
                                <input 
                                    type="text" 
                                    placeholder="https://my-project.firebaseio.com" 
                                    value={config.databaseURL}
                                    onChange={(e) => handleChange('databaseURL', e.target.value)}
                                    style={{width: '100%', padding: '10px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '13px', fontFamily: 'monospace', marginTop: '4px', boxSizing: 'border-box'}}
                                />
                            </div>
                            <div>
                                <label style={{fontSize: '12px', fontWeight: '600', color: '#374151'}}>Auth Domain</label>
                                <input 
                                    type="text" 
                                    placeholder="my-project.firebaseapp.com" 
                                    value={config.authDomain}
                                    onChange={(e) => handleChange('authDomain', e.target.value)}
                                    style={{width: '100%', padding: '10px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '13px', fontFamily: 'monospace', marginTop: '4px', boxSizing: 'border-box'}}
                                />
                            </div>
                        </div>

                        {error && <p style={{color: '#dc2626', fontSize: '13px', marginBottom: '16px', padding: '12px', backgroundColor: '#fee2e2', borderRadius: '6px', border: '1px solid #fca5a5'}}>{error}</p>}

                        <button 
                            onClick={handleSubmit}
                            style={{width: '100%', backgroundColor: '#2563eb', color: 'white', padding: '14px', borderRadius: '8px', border: 'none', cursor: 'pointer', fontSize: '15px', fontWeight: '600', marginBottom: '12px'}}
                        >
                            ✓ Connetti a Firebase
                        </button>

                        <p style={{fontSize: '12px', color: '#9ca3af', textAlign: 'center'}}>
                            Dopo la connessione, l'app sarà sincronizzata tra tutti i phone
                        </p>
                    </div>
                </div>
            );
        };

        // Main App
        const EgittoGestionale = () => {
            const [firebaseReady, setFirebaseReady] = useState(false);
            const [isConnected, setIsConnected] = useState(false);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [tours, setTours] = useState([]);
            const [bookings, setBookings] = useState([]);
            const [costs, setCosts] = useState([]);
            const [showNewTourForm, setShowNewTourForm] = useState(false);
            const [showNewBookingForm, setShowNewBookingForm] = useState(false);
            const [showNewCostForm, setShowNewCostForm] = useState(false);
            const [showInstallBanner, setShowInstallBanner] = useState(false);
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const dbRef = useRef(null);

            // Listen for beforeinstallprompt
            useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setShowInstallBanner(true);
                });

                // Hide banner if already installed
                window.addEventListener('appinstalled', () => {
                    setShowInstallBanner(false);
                    setDeferredPrompt(null);
                });
            }, []);

            const handleInstallClick = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    console.log(`User response to the install prompt: ${outcome}`);
                    setDeferredPrompt(null);
                    setShowInstallBanner(false);
                }
            };

            // Inizializza Firebase
            const initializeFirebase = useCallback((config) => {
                try {
                    const firebaseApp = firebase.initializeApp({
                        apiKey: config.apiKey,
                        authDomain: config.authDomain,
                        databaseURL: config.databaseURL,
                        projectId: config.projectId,
                    });
                    
                    dbRef.current = firebase.database(firebaseApp);
                    setFirebaseReady(true);
                    setupListeners();
                } catch (err) {
                    console.error('Errore Firebase:', err);
                    alert('Errore configurazione Firebase: ' + err.message);
                }
            }, []);

            // Setup listeners
            const setupListeners = useCallback(() => {
                if (!dbRef.current) return;

                dbRef.current.ref('tours').on('value', snapshot => {
                    const data = snapshot.val();
                    if (data) {
                        setTours(Object.entries(data).map(([id, tour]) => ({ id, ...tour })));
                    }
                    setIsConnected(true);
                });

                dbRef.current.ref('bookings').on('value', snapshot => {
                    const data = snapshot.val();
                    if (data) {
                        setBookings(Object.entries(data).map(([id, booking]) => ({ 
                            id, 
                            ...booking, 
                            totalPrice: parseFloat(booking.totalPrice || 0),
                            acconto: parseFloat(booking.acconto || 0),
                            saldo: parseFloat(booking.saldo || 0),
                            saldoPagato: parseFloat(booking.saldoPagato || 0)
                        })));
                    }
                });

                dbRef.current.ref('costs').on('value', snapshot => {
                    const data = snapshot.val();
                    if (data) {
                        setCosts(Object.entries(data).map(([id, cost]) => ({ 
                            id, 
                            ...cost,
                            amount: parseFloat(cost.amount || 0)
                        })));
                    }
                });
            }, []);

            // Carica config salvata
            useEffect(() => {
                const saved = localStorage.getItem('firebaseConfig');
                if (saved) {
                    try {
                        initializeFirebase(JSON.parse(saved));
                    } catch (e) {
                        console.error('Errore loading config:', e);
                    }
                }
            }, [initializeFirebase]);

            const addTour = useCallback((form) => {
                if (!dbRef.current) return;
                const newTourRef = dbRef.current.ref('tours').push();
                newTourRef.set({
                    name: form.name,
                    description: form.description,
                    basePrice: parseFloat(form.basePrice),
                    capacity: parseInt(form.capacity),
                    duration: form.duration,
                    createdAt: new Date().toISOString()
                });
                setShowNewTourForm(false);
            }, []);

            const addBooking = useCallback((form) => {
                if (!dbRef.current) return;
                const totalPrice = parseFloat(form.totalPrice);
                const acconto = parseFloat(form.acconto);
                const saldo = totalPrice - acconto;

                const newBookingRef = dbRef.current.ref('bookings').push();
                newBookingRef.set({
                    tourId: parseInt(form.tourId),
                    clientName: form.clientName,
                    participants: parseInt(form.participants),
                    date: form.date,
                    totalPrice,
                    acconto,
                    saldo,
                    accontoStatus: form.accontoStatus,
                    accontoData: form.accontoData || '',
                    accontoCollector: form.accontoCollector || '',
                    saldoPagato: 0,
                    saldoCollector: '',
                    createdAt: new Date().toISOString()
                });
                setShowNewBookingForm(false);
            }, []);

            const addCost = useCallback((form) => {
                if (!dbRef.current) return;
                const newCostRef = dbRef.current.ref('costs').push();
                newCostRef.set({
                    bookingId: parseInt(form.bookingId),
                    description: form.description,
                    amount: parseFloat(form.amount),
                    category: form.category,
                    createdAt: new Date().toISOString()
                });
                setShowNewCostForm(false);
            }, []);

            const deleteTour = useCallback((tourId) => {
                if (!dbRef.current) return;
                if (confirm('Elimina escursione?')) {
                    dbRef.current.ref(`tours/${tourId}`).remove();
                }
            }, []);

            const getTourName = useCallback((tourId) => {
                return tours.find(t => t.id === tourId)?.name || 'Sconosciuto';
            }, [tours]);

            // Componente Form Escursioni
            const FormEscursioni = ({ onSubmit, onCancel }) => {
                const [form, setForm] = useState({ name: '', description: '', basePrice: '', capacity: '', duration: '' });

                const handleChange = useCallback((field, value) => {
                    setForm(prev => ({ ...prev, [field]: value }));
                }, []);

                const handleSubmit = () => {
                    if (form.name && form.basePrice && form.capacity) {
                        onSubmit(form);
                        setForm({ name: '', description: '', basePrice: '', capacity: '', duration: '' });
                    }
                };

                return (
                    <div style={{backgroundColor: '#f9fafb', border: '1px solid #e5e7eb', borderRadius: '8px', padding: '24px', marginBottom: '24px'}}>
                        <h3 style={{fontSize: '18px', fontWeight: '600', marginBottom: '16px', color: '#111827'}}>Aggiungi Escursione</h3>
                        <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '16px', marginBottom: '16px'}}>
                            <input type="text" placeholder="Nome escursione" value={form.name} onChange={(e) => handleChange('name', e.target.value)} style={{padding: '10px 12px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '14px', fontFamily: 'system-ui', boxSizing: 'border-box'}} />
                            <input type="text" placeholder="Durata (es. 1 giorno)" value={form.duration} onChange={(e) => handleChange('duration', e.target.value)} style={{padding: '10px 12px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '14px', fontFamily: 'system-ui', boxSizing: 'border-box'}} />
                            <input type="number" placeholder="Prezzo base (€)" value={form.basePrice} onChange={(e) => handleChange('basePrice', e.target.value)} style={{padding: '10px 12px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '14px', fontFamily: 'system-ui', boxSizing: 'border-box'}} />
                            <input type="number" placeholder="Capienza massima" value={form.capacity} onChange={(e) => handleChange('capacity', e.target.value)} style={{padding: '10px 12px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '14px', fontFamily: 'system-ui', boxSizing: 'border-box'}} />
                            <input type="text" placeholder="Descrizione" value={form.description} onChange={(e) => handleChange('description', e.target.value)} style={{padding: '10px 12px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '14px', fontFamily: 'system-ui', gridColumn: '1 / -1', boxSizing: 'border-box'}} />
                        </div>
                        <div style={{display: 'flex', gap: '8px'}}>
                            <button onClick={handleSubmit} style={{backgroundColor: '#16a34a', color: 'white', padding: '10px 16px', borderRadius: '6px', border: 'none', cursor: 'pointer', fontSize: '14px', fontWeight: '500'}}>Salva</button>
                            <button onClick={onCancel} style={{backgroundColor: '#9ca3af', color: 'white', padding: '10px 16px', borderRadius: '6px', border: 'none', cursor: 'pointer', fontSize: '14px', fontWeight: '500'}}>Annulla</button>
                        </div>
                    </div>
                );
            };

            // Componente Form Prenotazioni
            const FormPrenotazioni = ({ tours, onSubmit, onCancel }) => {
                const [form, setForm] = useState({ tourId: '', clientName: '', participants: '', date: '', acconto: '', accontoStatus: 'da pagare', accontoData: '', accontoCollector: '' });

                const handleChange = useCallback((field, value) => {
                    setForm(prev => ({ ...prev, [field]: value }));
                }, []);

                const handleSubmit = () => {
                    const tour = tours.find(t => t.id === parseInt(form.tourId));
                    if (!tour) return;
                    
                    const totalPrice = tour.basePrice * parseInt(form.participants || 0);
                    if (form.tourId && form.clientName && form.participants && form.date && form.acconto && form.accontoStatus && form.accontoCollector) {
                        onSubmit({
                            ...form,
                            totalPrice
                        });
                        setForm({ tourId: '', clientName: '', participants: '', date: '', acconto: '', accontoStatus: 'da pagare', accontoData: '', accontoCollector: '' });
                    }
                };

                const tour = tours.find(t => t.id === parseInt(form.tourId));
                const totalPrice = tour ? tour.basePrice * parseInt(form.participants || 0) : 0;
                const saldo = totalPrice - parseFloat(form.acconto || 0);

                return (
                    <div style={{backgroundColor: '#f9fafb', border: '1px solid #e5e7eb', borderRadius: '8px', padding: '24px', marginBottom: '24px'}}>
                        <h3 style={{fontSize: '18px', fontWeight: '600', marginBottom: '16px', color: '#111827'}}>Aggiungi Prenotazione</h3>
                        <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '16px', marginBottom: '16px'}}>
                            <select value={form.tourId} onChange={(e) => handleChange('tourId', e.target.value)} style={{padding: '10px 12px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '14px', fontFamily: 'system-ui', boxSizing: 'border-box'}}>
                                <option value="">Seleziona Escursione</option>
                                {tours.map(t => <option key={t.id} value={t.id}>{t.name} - €{t.basePrice}</option>)}
                            </select>
                            <input type="text" placeholder="Nome cliente" value={form.clientName} onChange={(e) => handleChange('clientName', e.target.value)} style={{padding: '10px 12px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '14px', fontFamily: 'system-ui', boxSizing: 'border-box'}} />
                            <input type="number" placeholder="Numero partecipanti" value={form.participants} onChange={(e) => handleChange('participants', e.target.value)} style={{padding: '10px 12px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '14px', fontFamily: 'system-ui', boxSizing: 'border-box'}} />
                            <input type="date" value={form.date} onChange={(e) => handleChange('date', e.target.value)} style={{padding: '10px 12px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '14px', fontFamily: 'system-ui', boxSizing: 'border-box'}} />
                            <input type="number" placeholder="Acconto (€)" value={form.acconto} onChange={(e) => handleChange('acconto', e.target.value)} style={{padding: '10px 12px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '14px', fontFamily: 'system-ui', boxSizing: 'border-box'}} />
                            <select value={form.accontoStatus} onChange={(e) => handleChange('accontoStatus', e.target.value)} style={{padding: '10px 12px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '14px', fontFamily: 'system-ui', boxSizing: 'border-box'}}>
                                <option value="da pagare">Acconto: Da pagare</option>
                                <option value="pagato">Acconto: Pagato</option>
                            </select>
                            {form.accontoStatus === 'pagato' && (
                                <>
                                    <input type="date" value={form.accontoData} onChange={(e) => handleChange('accontoData', e.target.value)} style={{padding: '10px 12px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '14px', fontFamily: 'system-ui', boxSizing: 'border-box'}} />
                                    <select value={form.accontoCollector} onChange={(e) => handleChange('accontoCollector', e.target.value)} style={{padding: '10px 12px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '14px', fontFamily: 'system-ui', boxSizing: 'border-box'}}>
                                        <option value="">Chi ha incassato l'acconto?</option>
                                        <option value="Momo">Momo</option>
                                        <option value="Alessandra">Alessandra</option>
                                    </select>
                                </>
                            )}
                        </div>
                        {tour && form.participants && (
                            <div style={{display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '12px', marginBottom: '16px', padding: '12px', backgroundColor: '#e0f2fe', borderRadius: '6px'}}>
                                <div><p style={{fontSize: '12px', color: '#0c4a6e', fontWeight: '600'}}>Totale</p><p style={{fontSize: '16px', fontWeight: 'bold', color: '#0369a1', marginTop: '4px'}}>€{totalPrice.toFixed(2)}</p></div>
                                <div><p style={{fontSize: '12px', color: '#0c4a6e', fontWeight: '600'}}>Acconto</p><p style={{fontSize: '16px', fontWeight: 'bold', color: '#0369a1', marginTop: '4px'}}>€{parseFloat(form.acconto || 0).toFixed(2)}</p></div>
                                <div><p style={{fontSize: '12px', color: '#0c4a6e', fontWeight: '600'}}>Saldo Residuo</p><p style={{fontSize: '16px', fontWeight: 'bold', color: saldo > 0 ? '#dc2626' : '#15803d', marginTop: '4px'}}>€{saldo.toFixed(2)}</p></div>
                            </div>
                        )}
                        <div style={{display: 'flex', gap: '8px'}}>
                            <button onClick={handleSubmit} style={{backgroundColor: '#16a34a', color: 'white', padding: '10px 16px', borderRadius: '6px', border: 'none', cursor: 'pointer', fontSize: '14px', fontWeight: '500'}}>Salva</button>
                            <button onClick={onCancel} style={{backgroundColor: '#9ca3af', color: 'white', padding: '10px 16px', borderRadius: '6px', border: 'none', cursor: 'pointer', fontSize: '14px', fontWeight: '500'}}>Annulla</button>
                        </div>
                    </div>
                );
            };

            // Componente Form Costi
            const FormCosti = ({ bookings, onSubmit, onCancel }) => {
                const [form, setForm] = useState({ bookingId: '', description: '', amount: '', category: 'guide' });

                const handleChange = useCallback((field, value) => {
                    setForm(prev => ({ ...prev, [field]: value }));
                }, []);

                const handleSubmit = () => {
                    if (form.bookingId && form.description && form.amount) {
                        onSubmit(form);
                        setForm({ bookingId: '', description: '', amount: '', category: 'guide' });
                    }
                };

                return (
                    <div style={{backgroundColor: '#f9fafb', border: '1px solid #e5e7eb', borderRadius: '8px', padding: '24px', marginBottom: '24px'}}>
                        <h3 style={{fontSize: '18px', fontWeight: '600', marginBottom: '16px', color: '#111827'}}>Aggiungi Costo</h3>
                        <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '16px', marginBottom: '16px'}}>
                            <select value={form.bookingId} onChange={(e) => handleChange('bookingId', e.target.value)} style={{padding: '10px 12px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '14px', fontFamily: 'system-ui', boxSizing: 'border-box'}}>
                                <option value="">Seleziona Prenotazione</option>
                                {bookings.map(b => <option key={b.id} value={b.id}>{b.clientName}</option>)}
                            </select>
                            <input type="text" placeholder="Descrizione costo" value={form.description} onChange={(e) => handleChange('description', e.target.value)} style={{padding: '10px 12px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '14px', fontFamily: 'system-ui', boxSizing: 'border-box'}} />
                            <input type="number" placeholder="Importo (€)" value={form.amount} onChange={(e) => handleChange('amount', e.target.value)} style={{padding: '10px 12px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '14px', fontFamily: 'system-ui', boxSizing: 'border-box'}} />
                            <select value={form.category} onChange={(e) => handleChange('category', e.target.value)} style={{padding: '10px 12px', border: '1px solid #d1d5db', borderRadius: '6px', fontSize: '14px', fontFamily: 'system-ui', boxSizing: 'border-box'}}>
                                <option value="guide">Guida</option>
                                <option value="transport">Trasporto</option>
                                <option value="accommodation">Alloggio</option>
                                <option value="meals">Pasti</option>
                                <option value="other">Altro</option>
                            </select>
                        </div>
                        <div style={{display: 'flex', gap: '8px'}}>
                            <button onClick={handleSubmit} style={{backgroundColor: '#16a34a', color: 'white', padding: '10px 16px', borderRadius: '6px', border: 'none', cursor: 'pointer', fontSize: '14px', fontWeight: '500'}}>Salva</button>
                            <button onClick={onCancel} style={{backgroundColor: '#9ca3af', color: 'white', padding: '10px 16px', borderRadius: '6px', border: 'none', cursor: 'pointer', fontSize: '14px', fontWeight: '500'}}>Annulla</button>
                        </div>
                    </div>
                );
            };

            // Dashboard
            const Dashboard = () => {
                const totalRevenue = bookings.reduce((sum, b) => sum + (b.totalPrice || 0), 0);
                const totalCosts = costs.reduce((sum, c) => sum + (c.amount || 0), 0);
                const totalProfit = totalRevenue - totalCosts;
                const profitMargin = totalRevenue > 0 ? ((totalProfit / totalRevenue) * 100).toFixed(1) : 0;

                return (
                    <div style={{padding: '24px'}}>
                        <h2 style={{fontSize: '28px', fontWeight: 'bold', color: '#111827', marginBottom: '24px'}}>Panoramica Gestionale</h2>
                        <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))', gap: '16px', marginBottom: '24px'}}>
                            <div style={{backgroundImage: 'linear-gradient(to bottom right, #fef3c7, #fed7aa)', border: '1px solid #fcd34d', borderRadius: '8px', padding: '24px'}}>
                                <p style={{color: '#b45309', fontSize: '13px', fontWeight: '500'}}>Ricavi Totali</p>
                                <p style={{fontSize: '32px', fontWeight: 'bold', color: '#78350f', marginTop: '8px'}}>€{totalRevenue.toFixed(2)}</p>
                            </div>
                            <div style={{backgroundImage: 'linear-gradient(to bottom right, #fee2e2, #fecaca)', border: '1px solid #fca5a5', borderRadius: '8px', padding: '24px'}}>
                                <p style={{color: '#991b1b', fontSize: '13px', fontWeight: '500'}}>Costi Totali</p>
                                <p style={{fontSize: '32px', fontWeight: 'bold', color: '#7f1d1d', marginTop: '8px'}}>€{totalCosts.toFixed(2)}</p>
                            </div>
                            <div style={{backgroundImage: 'linear-gradient(to bottom right, #dcfce7, #bbf7d0)', border: '1px solid #86efac', borderRadius: '8px', padding: '24px'}}>
                                <p style={{color: '#166534', fontSize: '13px', fontWeight: '500'}}>Profitto Netto</p>
                                <p style={{fontSize: '32px', fontWeight: 'bold', color: '#15803d', marginTop: '8px'}}>€{totalProfit.toFixed(2)}</p>
                            </div>
                            <div style={{backgroundImage: 'linear-gradient(to bottom right, #cffafe, #a5f3fc)', border: '1px solid #67e8f9', borderRadius: '8px', padding: '24px'}}>
                                <p style={{color: '#164e63', fontSize: '13px', fontWeight: '500'}}>Margine Profitto</p>
                                <p style={{fontSize: '32px', fontWeight: 'bold', color: '#0e7490', marginTop: '8px'}}>{profitMargin}%</p>
                            </div>
                        </div>
                    </div>
                );
            };

            // Tours Manager
            const ToursManager = () => (
                <div style={{padding: '24px'}}>
                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px', gap: '12px', flexWrap: 'wrap'}}>
                        <h2 style={{fontSize: '28px', fontWeight: 'bold', color: '#111827'}}>Escursioni</h2>
                        <button onClick={() => setShowNewTourForm(true)} style={{backgroundColor: '#2563eb', color: 'white', padding: '10px 16px', borderRadius: '6px', border: 'none', cursor: 'pointer', fontSize: '14px', fontWeight: '500', display: 'flex', alignItems: 'center', gap: '8px', whiteSpace: 'nowrap'}}>
                            <PlusIcon /> Nuova
                        </button>
                    </div>
                    {showNewTourForm && <FormEscursioni onSubmit={addTour} onCancel={() => setShowNewTourForm(false)} />}
                    <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: '16px'}}>
                        {tours.map(tour => (
                            <div key={tour.id} style={{backgroundColor: 'white', border: '1px solid #e5e7eb', borderRadius: '8px', padding: '24px'}}>
                                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '8px'}}>
                                    <h3 style={{fontSize: '18px', fontWeight: '600', color: '#111827'}}>{tour.name}</h3>
                                    <button onClick={() => deleteTour(tour.id)} style={{color: '#dc2626', cursor: 'pointer', background: 'none', border: 'none', fontSize: '18px'}}>
                                        <TrashIcon />
                                    </button>
                                </div>
                                <p style={{fontSize: '14px', color: '#6b7280', marginBottom: '16px'}}>{tour.description}</p>
                                <div style={{display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '8px', paddingTop: '16px', borderTop: '1px solid #e5e7eb'}}>
                                    <div><p style={{fontSize: '12px', color: '#9ca3af'}}>Durata</p><p style={{fontWeight: '600', marginTop: '4px'}}>{tour.duration}</p></div>
                                    <div><p style={{fontSize: '12px', color: '#9ca3af'}}>Prezzo</p><p style={{fontWeight: '600', marginTop: '4px'}}>€{tour.basePrice}</p></div>
                                    <div><p style={{fontSize: '12px', color: '#9ca3af'}}>Capienza</p><p style={{fontWeight: '600', marginTop: '4px'}}>{tour.capacity} pax</p></div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            // Bookings Manager
            const BookingsManager = () => (
                <div style={{padding: '24px'}}>
                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px', gap: '12px', flexWrap: 'wrap'}}>
                        <h2 style={{fontSize: '28px', fontWeight: 'bold', color: '#111827'}}>Prenotazioni</h2>
                        <button onClick={() => setShowNewBookingForm(true)} style={{backgroundColor: '#2563eb', color: 'white', padding: '10px 16px', borderRadius: '6px', border: 'none', cursor: 'pointer', fontSize: '14px', fontWeight: '500', display: 'flex', alignItems: 'center', gap: '8px', whiteSpace: 'nowrap'}}>
                            <PlusIcon /> Nuova
                        </button>
                    </div>
                    {showNewBookingForm && <FormPrenotazioni tours={tours} onSubmit={addBooking} onCancel={() => setShowNewBookingForm(false)} />}
                    <div style={{overflowX: 'auto'}}>
                        <table style={{width: '100%', borderCollapse: 'collapse', fontSize: '14px'}}>
                            <thead style={{backgroundColor: '#f3f4f6', borderBottom: '2px solid #e5e7eb'}}>
                                <tr>
                                    <th style={{padding: '12px 6px', textAlign: 'left', fontWeight: '600', color: '#111827'}}>Cliente</th>
                                    <th style={{padding: '12px 6px', textAlign: 'left', fontWeight: '600', color: '#111827'}}>Escursione</th>
                                    <th style={{padding: '12px 6px', textAlign: 'right', fontWeight: '600', color: '#111827'}}>Totale</th>
                                    <th style={{padding: '12px 6px', textAlign: 'center', fontWeight: '600', color: '#111827'}}>Acconto</th>
                                </tr>
                            </thead>
                            <tbody>
                                {bookings.map(b => (
                                    <tr key={b.id} style={{borderBottom: '1px solid #e5e7eb'}}>
                                        <td style={{padding: '10px 6px', color: '#111827'}}>{b.clientName}</td>
                                        <td style={{padding: '10px 6px', color: '#111827'}}>{getTourName(b.tourId)}</td>
                                        <td style={{padding: '10px 6px', textAlign: 'right', fontWeight: '600', color: '#b45309'}}>€{(b.totalPrice || 0).toFixed(2)}</td>
                                        <td style={{padding: '10px 6px', textAlign: 'center', fontSize: '11px'}}>
                                            {b.accontoStatus === 'pagato' ? (
                                                <div style={{backgroundColor: '#dcfce7', border: '1px solid #15803d', borderRadius: '4px', padding: '3px'}}>
                                                    <p style={{fontSize: '10px', color: '#166534', fontWeight: '600', margin: '0'}}>€{(b.acconto || 0).toFixed(2)}</p>
                                                </div>
                                            ) : (
                                                <div style={{backgroundColor: '#fee2e2', border: '1px solid #dc2626', borderRadius: '4px', padding: '3px'}}>
                                                    <p style={{fontSize: '10px', color: '#7f1d1d', fontWeight: '600', margin: '0'}}>Da pagare</p>
                                                </div>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );

            // Costs Manager
            const CostsManager = () => (
                <div style={{padding: '24px'}}>
                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px', gap: '12px', flexWrap: 'wrap'}}>
                        <h2 style={{fontSize: '28px', fontWeight: 'bold', color: '#111827'}}>Costi</h2>
                        <button onClick={() => setShowNewCostForm(true)} style={{backgroundColor: '#2563eb', color: 'white', padding: '10px 16px', borderRadius: '6px', border: 'none', cursor: 'pointer', fontSize: '14px', fontWeight: '500', display: 'flex', alignItems: 'center', gap: '8px', whiteSpace: 'nowrap'}}>
                            <PlusIcon /> Nuovo
                        </button>
                    </div>
                    {showNewCostForm && <FormCosti bookings={bookings} onSubmit={addCost} onCancel={() => setShowNewCostForm(false)} />}
                    <div style={{overflowX: 'auto'}}>
                        <table style={{width: '100%', borderCollapse: 'collapse', fontSize: '14px'}}>
                            <thead style={{backgroundColor: '#f3f4f6', borderBottom: '2px solid #e5e7eb'}}>
                                <tr>
                                    <th style={{padding: '12px 6px', textAlign: 'left', fontWeight: '600', color: '#111827'}}>Cliente</th>
                                    <th style={{padding: '12px 6px', textAlign: 'left', fontWeight: '600', color: '#111827'}}>Descrizione</th>
                                    <th style={{padding: '12px 6px', textAlign: 'left', fontWeight: '600', color: '#111827'}}>Categoria</th>
                                    <th style={{padding: '12px 6px', textAlign: 'right', fontWeight: '600', color: '#111827'}}>Importo</th>
                                </tr>
                            </thead>
                            <tbody>
                                {costs.map(cost => (
                                    <tr key={cost.id} style={{borderBottom: '1px solid #e5e7eb'}}>
                                        <td style={{padding: '10px 6px', color: '#111827'}}>{bookings.find(b => b.id === cost.bookingId)?.clientName}</td>
                                        <td style={{padding: '10px 6px', color: '#111827'}}>{cost.description}</td>
                                        <td style={{padding: '10px 6px', color: '#111827', textTransform: 'capitalize'}}>{cost.category}</td>
                                        <td style={{padding: '10px 6px', textAlign: 'right', fontWeight: '600', color: '#dc2626'}}>€{(cost.amount || 0).toFixed(2)}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );

            if (!firebaseReady) {
                return <FirebaseSetup onComplete={initializeFirebase} />;
            }

            return (
                <div style={{minHeight: '100vh', backgroundImage: 'linear-gradient(to bottom right, #fef3c7, white, #cffafe)', display: 'flex', flexDirection: 'column'}}>
                    <InstallBanner 
                        onInstall={handleInstallClick} 
                        onClose={() => setShowInstallBanner(false)}
                        showBanner={showInstallBanner && deferredPrompt !== null}
                    />
                    
                    <div className="app-container" style={{flex: 1, overflow: 'auto'}}>
                        <div style={{maxWidth: '1280px', margin: '0 auto', padding: '32px 16px'}}>
                            <div style={{marginBottom: '32px', borderBottom: '2px solid #fcd34d', paddingBottom: '24px'}}>
                                <h1 style={{fontSize: '36px', fontWeight: 'bold', color: '#111827'}}>Gestionale Escursioni Egitto</h1>
                                <p style={{color: '#6b7280', marginTop: '8px'}}>✨ Sincronizzato su tutti i phone</p>
                            </div>

                            <div style={{display: 'flex', gap: '8px', marginBottom: '32px', borderBottom: '1px solid #e5e7eb', overflowX: 'auto', paddingBottom: '12px'}}>
                                {['dashboard', 'tours', 'bookings', 'costs'].map(tab => (
                                    <button
                                        key={tab}
                                        onClick={() => setActiveTab(tab)}
                                        style={{
                                            padding: '12px 16px',
                                            fontSize: '14px',
                                            fontWeight: '500',
                                            borderBottom: activeTab === tab ? '2px solid #2563eb' : 'transparent',
                                            color: activeTab === tab ? '#2563eb' : '#6b7280',
                                            border: 'none',
                                            cursor: 'pointer',
                                            textTransform: 'capitalize',
                                            backgroundColor: 'transparent',
                                            whiteSpace: 'nowrap'
                                        }}
                                    >
                                        {tab === 'dashboard' && 'Dashboard'}
                                        {tab === 'tours' && 'Escursioni'}
                                        {tab === 'bookings' && 'Prenotazioni'}
                                        {tab === 'costs' && 'Costi'}
                                    </button>
                                ))}
                            </div>

                            <div style={{backgroundColor: 'white', borderRadius: '8px', marginBottom: '32px'}}>
                                {activeTab === 'dashboard' && <Dashboard />}
                                {activeTab === 'tours' && <ToursManager />}
                                {activeTab === 'bookings' && <BookingsManager />}
                                {activeTab === 'costs' && <CostsManager />}
                            </div>
                        </div>
                    </div>

                    <div className="sync-indicator">
                        <div className={`sync-dot ${isConnected ? 'connected' : 'disconnected'}`}></div>
                        <span>{isConnected ? '✓ Sincronizzato' : '⏳ Connessione...'}</span>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<EgittoGestionale />, document.getElementById('root'));
    </script>
</body>
</html>
