<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestionale</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(to bottom right, #fef3c7, white, #cffafe);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .login-box { 
            background: white; 
            padding: 40px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
        }
        h1 { text-align: center; margin-bottom: 30px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 2px solid #ddd; 
            border-radius: 5px; 
            font-size: 16px; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 10px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            font-size: 16px; 
            cursor: pointer; 
        }
        button:hover { background: #0056b3; }
        .error { color: red; margin-top: 10px; text-align: center; display: none; }
        #app { display: none; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div class="login-box" id="login">
        <h1>🔐 Accesso</h1>
        <input type="password" id="pass" placeholder="Password">
        <button onclick="check()">Accedi</button>
        <p class="error" id="err">Password errata!</p>
    </div>
    
    <div id="app"></div>

    <script>
        function check() {
            if (document.getElementById('pass').value === 'watchcrypt2026') {
                document.getElementById('login').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                loadApp();
            } else {
                document.getElementById('err').style.display = 'block';
                document.getElementById('pass').value = '';
            }
        }
        
        document.getElementById('pass').onkeypress = function(e) {
            if (e.key === 'Enter') check();
        }
        
        function loadApp() {
            const iframe = document.createElement('iframe');
            iframe.src = 'egitto-gestionale-pwa.html';
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = 'none';
            document.getElementById('app').appendChild(iframe);
        }
    </script>
</body>
</html>
